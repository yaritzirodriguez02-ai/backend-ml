
server.port=8080
spring.application.name=mercaditolibre

#conexion a base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/mercaditolibre_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#configuracion de jpa/hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#congiguracion global de cors para react
spring.mvc.cors.allowed-origins=http://localhost:5173
spring.mvc.cors.allowed-methods=GET, POST, PUT, DELETE, OPTIONS

#propiedades de seguridad 
app.jwt.secret=MiClaveSuperSecretaMercaditoLibre2026JWT12345
app.jwt.expiration-ms=86400000

  
